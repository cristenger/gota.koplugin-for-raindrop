name: Validate Gota

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lua-and-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1 and gettext
        run: sudo apt-get update && sudo apt-get install --yes lua5.1 gettext

      - name: Validate Lua and regression tests
        working-directory: gota.koplugin
        run: |
          luac5.1 -p *.lua tests/run.lua
          lua5.1 tests/run.lua

      - name: Validate localization and scripts
        working-directory: gota.koplugin
        run: |
          python3 -m py_compile extract_strings.py replace_strings.py
          msgfmt --check -o /dev/null l10n/es/gota.po
